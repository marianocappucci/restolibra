[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restolibra"
version = "0.1.0.dev0"
description = "Gestion gastronomica: salon, comandas, KDS, recetas y food cost, sobre el motor contable."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Declaradas con git+https y no git+ssh a proposito: asi el dev local en
# WSL funciona sin identidad SSH propia contra GitHub. El Dockerfile y el
# CI reescriben esas URLs a ssh con `insteadOf`, cada una con su alias y su
# clave -- ver el comentario del Dockerfile.
dependencies = [
    # libracore provee facturacion/caja/ARCA y la base donde vive `usuarios`.
    # El auth SALIO de aca el 2026-07-30 y ahora lo da libraauth.
    #
    # v1.6.0 -> v1.8.0 (2026-08-04). De los productos que quedaban atras, este
    # es el que mas superficie comparte con el motor: usa `pdf_generator` (via
    # el shim de `app/pdf_generator.py`, 12 archivos) y `ticket_generator` (4).
    # Le llegan las dos cosas:
    #
    # - v1.7.0: un caracter fuera de latin-1 -un guion largo o unas comillas
    #   curvas en el nombre de empresa, en un item o en las observaciones-
    #   devolvia **500 al descargar el comprobante**. Es un bug vivo.
    # - v1.8.0: la maqueta compacta. **Cambia el aspecto** de facturas, remitos
    #   y presupuestos: membrete 51,5 -> 40,3 mm y tarjetas Emisor/Cliente
    #   65 -> 50,6 mm, con lo que entran ~10 items en la primera carilla en vez
    #   de 6. Sin eliminar ningun campo ni achicar ninguna tipografia.
    #
    # v1.28.4 -> v1.31.0 (2026-08-12). Son dos:
    #
    # - v1.30.0: un comprobante se fecha con SU fecha y no con el reloj, asi que
    #   reimprimirlo da byte a byte el mismo archivo. Toca todo lo que este
    #   producto emite: los tickets, factura, remito, presupuesto, los recibos y
    #   el resumen de cuenta corriente. La comanda de cocina NO: la arma este
    #   repo sobre `TicketPDF` (app/ticket_generator.py) y se sigue fechando con
    #   el reloj.
    # - v1.31.0: `pinear_image` escribia la imagen de la app en el primer
    #   `image:` del compose. **Aca eso es el sidecar**: en docker-compose.yml
    #   `restolibra-postgres` (con `image: postgres:16`) va declarado ANTES que
    #   `restolibra-dev`, o sea el layout exacto donde el bug le pone la imagen
    #   de la aplicacion al contenedor de la base. Ahora el servicio se elige
    #   por `container_name`.
    #
    # v1.33.0 -> v1.37.0 (2026-08-14): los PDF no se salen del marco del papel.
    # De los cuatro modulos que cambiaron en el salto, este producto consume
    # UNO: `pdf_generator`. `admin/` y `provisioning/` no se importan aca --se
    # verifico con un grep de los imports-- asi que el bump es, en la practica,
    # el arreglo de los comprobantes:
    #
    # - `_wrap_text` parte por caracter la palabra que no entra en el renglon.
    #   Un texto sin espacios --un codigo de orden de compra, una URL, un
    #   serial pegado-- volvia entero y `cell` lo dibujaba: medido, 435 mm de
    #   borde derecho en una hoja de 210, en remito, presupuesto, factura y
    #   resumen de cuenta corriente.
    # - `_recortar` mete en su celda, con elipsis, la condicion de venta y las
    #   filas del detalle de cobros del recibo. Estos dos desbordaban **con
    #   datos normales**, sin necesidad de un caso extremo.
    # - El margen del marco lo pone ahora `_TextoSeguroPDF`, la base de todos
    #   los documentos, en vez de depender de que cada uno llame a
    #   `set_margins`. El recibo era el que no lo llamaba.
    #
    # Los cinco comprobantes salen byte por byte identicos a como salian
    # (sha256 comparado con datos reales), asi que el bump no cambia nada de lo
    # ya emitido.
    #
    # v1.37.0 -> v1.38.0 (2026-08-14): las filas meta del membrete tambien se
    # recortan. La caja del valor mide ~31 mm --unos 25 caracteres a 7 pt-- y
    # `cell` no recorta: lo que se pasa se dibujaba afuera del papel. El unico
    # documento que mete texto libre ahi es el RECIBO, que pone el concepto en
    # ("Comprobante:", ref_line). Medido en la demo de VentaLibra: "Pago a
    # cuenta en cuenta corriente" terminaba en 202,2 mm en una hoja de 210.
    #
    # Es anterior a v1.37.0 y aquel arreglo no lo cubria.
    # v1.51.0 sube al motor el vocabulario de medios de pago
    # (libracore.medios_pago), que estaba declarado 28 veces en 11 repos --
    # TRES de ellas en este mismo repo, byte a byte. Ver
    # wiki/concepts/medios-de-pago-familia-libra.md.
    # 🔴 El extra `[migrations]` **hace falta desde el 2026-08-25**: trae alembic,
    # que este producto NO tenía en su contenedor (medido) y que
    # `libracore-migrar` necesita para aplicar la cadena del motor. Sin él, el
    # paso del deploy muere con un `ModuleNotFoundError` en vez de correr.
    # v1.78.0 (2026-09-03): la cuenta corriente normaliza el CUIT al cruzar
    # `clients` con `facturas` (sacando los guiones de los dos lados antes de
    # comparar). Sin esto, un cliente cuyo CUIT tiene guiones en la ficha pero
    # alguna factura los perdió (las dos grafías conviven en la base real) ve
    # su deuda por facturas invisible en el saldo de cuenta corriente.
    # Detectado en producción de Contalibra, ver wiki/entities/contalibra.md;
    # no se encontró ningún cliente de Restolibra expuesto hoy (demo revisada,
    # 0 casos), pero el bug es del motor compartido.
    "libracore[migrations] @ git+https://github.com/marianocappucci/libracore.git@v1.78.0",
    # v0.7.0 sube al motor las transferencias entre depositos y la guarda de
    # disponibilidad, que hasta ahora vivian en cada producto (`db_productos.
    # transferir_stock`, identico byte a byte al de Contalibra) y arrastraban
    # dos defectos: no eran atomicas y el chequeo corria en otra conexion antes
    # de escribir. v0.7.1 agrega el `reason_code` por pata, sin el cual
    # adoptarlas degradaba `db_logs` de `transferencia_salida` a `transfer_out`.
    "libracommerce @ git+https://github.com/marianocappucci/libracommerce.git@v0.9.1",
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.35.0",
    # Nodo offline. Entra como dependencia NORMAL y no como extra opcional, y la
    # razon es el schema: las tablas de LibraEdge se crean en la cadena de
    # Alembic, y una revision que las creara solo cuando el paquete estuviera
    # instalado dejaria el schema de unas instancias distinto del de otras, en
    # silencio -- exactamente lo que la baseline dice que hay que evitar con las
    # FK condicionales.
    #
    # Ademas el CENTRAL las necesita aunque el mismo no sea un nodo:
    # `node_identity` para autenticar a los nodos que le pushean, `sync_inbox`
    # para deduplicar, y `sync_changelog` para publicar la bajada.
    #
    # El costo es bajo: el paquete declara `dependencies = []`, es Python puro y
    # no arrastra ninguna transitiva.
    #
    # 🔴 Pinneado a un TAG y no a `@develop`, que es como lo consumia el otro
    # motor. Un pin a la rama trae lo que haya ahi en el momento del build, y con
    # las tablas de LibraEdge dentro de esta cadena de Alembic un cambio de
    # schema no anunciado llegaria al proximo deploy. `v0.2.0` es el primer tag
    # que ese repo tuvo: se corto el 2026-08-30, junto con este piloto.
#
# v0.2.0 -> v0.4.1 (2026-08-30): trae create_sync_router, que es lo que este
# producto monta para exponer /sync/v1/*, y el fix del handler --sin el, el
# router rechazaba TODAS las operaciones y cada venta de cada nodo terminaba
# en revision manual con el nodo reportandose en linea--.
#
# v0.4.1 -> v0.5.0 (2026-08-30): las pruebas de desastre encontraron que una
# operacion colgada en estado sending --por un corte a mitad del envio-- no la
# reintentaba NADIE nunca. La venta que el nodo cobro no llegaba al central, no
# habia error, y se descubria en el arqueo. Estuvo ahi desde la primera version
# del worker.
#
# v0.5.0 -> v0.6.6 (2026-08-31): el nodo no guardaba su cursor del espejo.
# `set_server_cursor` hacia UPDATE sobre una `node_identity` vacia --del lado
# del nodo nadie creaba la fila-- y un UPDATE de cero filas es un exito, asi
# que cada ciclo pedia desde 0 y rebajaba el espejo COMPLETO. Medido contra
# el central de demo: 102 cambios, y los mismos 102 al minuto siguiente.
#
# Este pin es lo que decide que version de LibraEdge viaja en la carga de
# CADA nodo instalado, asi que sin este salto todas las instalaciones
# seguirian con el defecto.
#
# El salto es a v0.6.7 y no a v0.6.6, y lo enseno el CI: libraedge declaraba
# `version = "0.6.0"` a mano en su pyproject mientras los tags iban por
# v0.6.6, asi que el chequeo de pines de este repo fallo con
# `pin=0.6.6 instalado=0.6.0`. v0.6.7 es el primer tag que saca la version
# de `git describe`, como libracore.
#
# v0.6.7 -> v0.6.9 (2026-08-31): el latido del nodo. El central no tenia
# forma de saber que una sucursal dejo de sincronizar --un nodo callado se
# veia igual que uno al dia-- y ahora `node_identity.last_seen_at` se anota
# en la autenticacion de las rutas de sync. De ese dato vive `nodo_offline
# vigilar`, que es lo que corre el cron del central.
#
# (v0.6.8 fue el respaldo del nodo y la bandeja, del lado del instalador.)
    "libraedge @ git+https://github.com/marianocappucci/libraedge.git@v0.6.10",
    # SQLAlchemy entra SOLO para el engine de `usuarios` de libraauth (ver
    # app/db_usuarios.py); el resto de Restolibra sigue en sqlite3 crudo.
    "sqlalchemy>=2.0",
    "fpdf2>=2.7.9",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13",
    "pytest>=8.0",
    "httpx>=0.27.0",
]

# `plans.py` NO entra en el paquete: libracore lo importa por nombre
# (`import plans`) desde tres lugares -- db/modulos.py, provisioning/ y
# admin/services.py, este ultimo usado por el backoffice, que es
# produccion. Vive en la raiz del repo, igual que en gestiolibra, medlibra
# y ventalibra. `admin/` y `scripts/` tampoco: son procesos aparte que
# corren fuera del contenedor (systemd y cron).
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "con_red: el test SI puede salir a un servicio externo",
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

# 🔴 TRINQUETE, no "reglas que no importan". Cada linea lleva la cuenta del
# dia que se unifico el regimen: la lista SOLO se achica, y lo que no esta
# aca ya no puede entrar en codigo nuevo. Los casos auto-corregibles
# (orden de imports y modernizacion) se arreglaron en el mismo commit.
ignore = [
    "F401",      # 61 caso(s): import sin usar. 🔴 NO se auto-corrige a proposito: de los 430
              #   de la familia, 168 son RE-EXPORTS —`scripts/panel_admin.py`
              #   re-exporta 27 nombres que `libracore.admin.services` usa como
              #   `pa.find_client`, `pa.compose`, `pa._NPM_AVAILABLE`—. Borrarlos
              #   rompe el backoffice en runtime con los tests en verde.
    "E702",      # 22 caso(s): dos sentencias en una linea separadas por `;`.
    "B904",      # 18 caso(s): `raise ... from err` dentro de un except. Ruff NO tiene fix, ni
              #   siquiera unsafe: son a mano, una por una.
    "E501",      # 8 caso(s): linea de mas de 120. Sin fix automatico: hay que reescribirla.
    "E402",      # 8 caso(s): import que no esta arriba de todo. Suele ser a proposito
              #   (cargar algo antes de importar), asi que se mira caso por caso.
    "E741",      # 3 caso(s): nombre de variable ambiguo (`l`, `I`, `O`). Renombrar a mano.
    "E731",      # 2 caso(s): lambda asignada a un nombre en vez de un `def`.
    "E722",      # 1 caso(s): `except:` pelado.
    "B017",      # 1 caso(s): `assertRaises(Exception)` a secas en un test.
]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo mide (61%, medido el 2026-09-03), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 59
