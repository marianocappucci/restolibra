services:
  # El backend de la instancia de dev desde el corte a PostgreSQL.
  #
  # 🔴 La clave del servicio lleva el nombre del producto y no es `db` ni
  # `postgres`: `stack-net` es una red COMPARTIDA por todo el VPS y Compose
  # convierte la clave en un alias de red. Dos composes con la misma clave se
  # turnan por round-robin del DNS interno — ya pasó en esta familia.
  #
  # 🔴 Imagen Debian (`postgres:16`), la misma del CI: el collation viene de la
  # imagen y la alpine ordena por bytes, como SQLite.
  #
  # Una sola base, a diferencia de Gestiolibra y MedLibra: acá el core y el
  # dominio comparten schema, que es como ya convivían en el mismo archivo.
  #
  # Sin `ports:` a propósito: sólo se llega desde la red interna.
  restolibra-postgres:
    image: postgres:16
    command: postgres -c timezone=America/Argentina/Buenos_Aires
    container_name: restolibra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restolibra
      POSTGRES_USER: restolibra
      # Sin default a propósito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave escrita en git.
      POSTGRES_PASSWORD: ${RESTOLIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - restolibra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restolibra -d restolibra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datos

  restolibra-dev:
    build:
      context: .
      # pyproject.toml depende de libracore Y libracommerce (P8), paquetes
      # privados distintos via git+ssh, cada uno con su propia deploy key —
      # el Dockerfile monta dos ids separados (libracore/libracommerce) para
      # que GitHub no autentique con la key equivocada (ver Dockerfile y
      # wiki/entities/restolibra.md).
      # Desde la migración a libra-ui son TRES: el stage `frontend-build`
      # del Dockerfile monta `id=libra-ui` para el `npm ci`, y sin él
      # `docker compose build` falla con exit 128 al clonarlo (mismo bug que
      # tenían los otros cuatro productos, corregido el 2026-07-28 — acá no
      # se había notado porque el backend sigue arrancando: el bind mount
      # `./:/app` sólo trae el código Python, el frontend se sirve horneado
      # desde la imagen, así que un rebuild fallido dejaba el dev sirviendo
      # un frontend viejo en silencio).
      ssh:
        - libracore=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
        - libracommerce=${LIBRACOMMERCE_SSH_KEY:-~/.ssh/id_ed25519_libracommerce}
        - libraauth=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
        - libra-ui=${LIBRA_UI_SSH_KEY:-~/.ssh/id_ed25519_libra_ui}
    container_name: restolibra-dev
    depends_on:
      restolibra-postgres:
        condition: service_healthy
    restart: unless-stopped
    # Límites agregados en la auditoría 2026-07-12 (ver
    # wiki/analyses/restolibra-auditoria-produccion): sin esto, un contenedor
    # de Restolibra sin tope puede consumir toda la RAM/CPU del VPS y tumbar
    # a Contalibra-producción, que comparte el mismo host.
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8073:8000"
    volumes:
      - ./:/app
    command: uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - SECRET_KEY=${SECRET_KEY:-restolibra-dev-secret}
      - TZ=America/Argentina/Buenos_Aires
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador}
      - DATA_DIR=/app/dev-data
      # 🔴 El corte a PostgreSQL. Esta variable gana sobre la ruta derivada de
      # DATA_DIR (ver app/db_core.py) y es lo único que mueve la instancia de
      # motor.
      #
      # Rollback: comentar esta línea y reiniciar. El `.db` sigue en
      # `dev-data/` sin tocar — la migración copia, no mueve.
      - RESTOLIBRA_DATABASE_URL=postgresql://restolibra:${RESTOLIBRA_POSTGRES_PASSWORD:?hay que definirla en el .env del VPS}@restolibra-postgres:5432/restolibra
      - ENV=development
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      # Recuperacion de contrasena (libraauth v0.5.0). Sin SMTP la app
      # levanta igual y POST /api/forgot-password devuelve 503: cargar
      # estas variables es lo unico que falta para que mande mails.
      - RESTOLIBRA_RESET_URL_BASE=${RESTOLIBRA_RESET_URL_BASE:-https://dev.restolibra.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-Restolibra}
    networks:
      - stack-net
      - datos

volumes:
  restolibra-postgres-data:

networks:
  datos:
    name: restolibra-dev-datos
  stack-net:
    external: true
    name: stack_stack-net
