services:
  restolibra-dev:
    build:
      context: .
      # requirements.txt depende de libracore (paquete privado) via git+ssh —
      # ver LIBRACORE_SSH_KEY en scripts/panel_admin.py y wiki/entities/libracore.md.
      ssh:
        - default=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
    container_name: restolibra-dev
    restart: unless-stopped
    # Límites agregados en la auditoría 2026-07-12 (ver
    # wiki/analyses/restolibra-auditoria-produccion): sin esto, un contenedor
    # de Restolibra sin tope puede consumir toda la RAM/CPU del VPS y tumbar
    # a Contalibra-producción, que comparte el mismo host.
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8073:8000"
    volumes:
      - ./:/app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - SECRET_KEY=${SECRET_KEY:-restolibra-dev-secret}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador}
      - DATA_DIR=/app/dev-data
      - ENV=development
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
