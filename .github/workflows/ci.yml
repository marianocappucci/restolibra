name: CI

on:
  # Sin `push` a ramas: `develop` y `main` estan protegidas (2026-08-11,
  # `enforce_admins: true`), asi que todo entra por PR y el run del PR verifica
  # el MERGE -- que es exactamente lo que queda en la rama. El push repetia esa
  # misma verificacion sobre un arbol identico: medido, tres commits distintos
  # con el mismo tree hash y hasta cuatro corridas por cambio.
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya
# no le sirve a nadie, porque reporta sobre un codigo que no es el que quedo
# en la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires

    # La suite corre AHORA TAMBIEN contra PostgreSQL, en un segundo paso.
    # Hasta el 2026-08-10 este producto no podia ni intentarlo: el motor
    # quedaba elegido en `db_core`, que derivaba una ruta de DATA_DIR. La
    # primera corrida real dio 132 rojos, y quedaron en cero.
    #
    # Imagen Debian (`postgres:16`) y no la alpine: el collation viene de la
    # imagen y tiene que ser el de produccion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restolibra
          POSTGRES_USER: restolibra
          POSTGRES_PASSWORD: restolibra-ci
          TZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U restolibra -d restolibra"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      # F3 (2026-09-05): un PR que solo toca frontend/ o documentacion no corre
      # la suite de backend. Es el job caro -de 4 a 11 minutos por corrida en
      # los ocho productos, medido en la auditoria de F3-; el de frontend cuesta
      # el minimo facturable y no se toca. Los pasos de abajo llevan
      # `if: steps.cambios.outputs.backend == 'true'`: el job sigue existiendo
      # y termina en verde con los pasos salteados, asi que la proteccion de
      # rama, que exige `test`, no cambia. Ante cualquier duda -no es un PR, la
      # API no contesta, lista vacia- corre todo. La lista sale de la API y no
      # de `git diff` porque el checkout es superficial.
      - name: Que toca el PR
        id: cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.pull_request.number }}"
          if [ -z "$n" ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; echo "no es un PR: corre todo"; exit 0; fi
          if ! archivos=$(gh api "repos/${{ github.repository }}/pulls/$n/files" --paginate --jq '.[].filename'); then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "la API no contesto: corre todo"; exit 0
          fi
          backend=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              frontend/*) ;;
              *.md|docs/*|*.txt) ;;
              *) backend=true ;;
            esac
          done <<< "$archivos"
          [ -z "$archivos" ] && backend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend"; echo "$archivos" | head -80
      - uses: actions/setup-python@v7
        if: steps.cambios.outputs.backend == 'true'
        with:
          python-version: "3.12"

      # libracore, libracommerce y libraauth son repos privados,
      # inalcanzables con el GITHUB_TOKEN por defecto (scopeado solo a este
      # repo). Se accede con deploy keys SSH de solo lectura, una por
      # repo-motor, cuyas claves privadas viven en los secrets de abajo.
      #
      # Por que deploy keys y no un PAT: un PAT vence sin aviso y tumba el
      # CI de todos los repos que lo comparten a la vez (y en el VPS tumbo
      # un deploy real: incidente Restolibra del 2026-07-25). Las deploy
      # keys no vencen. Mismo mecanismo que ya usa el VPS.
      #
      # El alias `github-<repo>` con IdentitiesOnly no es adorno: con dos
      # claves cargadas, SSH las ofrece en orden y GitHub autentica con la
      # primera que acepta, que puede no ser la del repo que se esta
      # clonando -- una deploy key ES una identidad por repo.
      #
      # DIFERENCIA con gestiolibra/medlibra/ventalibra: este repo declara
      # sus motores como `git+ssh://git@github.com/...` y no `git+https`,
      # asi que el insteadOf tiene que reescribir ESA forma. Se configuran
      # las dos por las dudas: la https no molesta y cubre cualquier
      # `git clone` que aparezca despues.
      - name: Configure SSH access to private Libra dependencies
        if: steps.cambios.outputs.backend == 'true'
        env:
          LIBRACORE_DEPLOY_KEY: ${{ secrets.LIBRACORE_DEPLOY_KEY }}
          LIBRACOMMERCE_DEPLOY_KEY: ${{ secrets.LIBRACOMMERCE_DEPLOY_KEY }}
          LIBRAAUTH_DEPLOY_KEY: ${{ secrets.LIBRAAUTH_DEPLOY_KEY }}
          # Nodo offline (Fase 3). libraedge entra como dependencia NORMAL
          # porque sus tablas se crean en la cadena de Alembic — ver el
          # comentario en pyproject.toml. Su clave se rotó el 2026-08-30: la
          # privada de la anterior no estaba en ~/.ssh y un secret no se puede
          # leer de vuelta.
          LIBRAEDGE_DEPLOY_KEY: ${{ secrets.LIBRAEDGE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          configurar() {
            repo=$1; clave=$2
            if [ -z "$clave" ]; then
              echo "::error::Falta el secret con la deploy key de $repo en este repositorio."
              exit 1
            fi
            printf '%s\n' "$clave" > ~/.ssh/id_"$repo"
            chmod 600 ~/.ssh/id_"$repo"
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n' \
              "$repo" "$repo" >> ~/.ssh/config
            destino="git@github-$repo:marianocappucci/$repo"
            git config --global "url.$destino.insteadOf" "ssh://git@github.com/marianocappucci/$repo"
            git config --global --add "url.$destino.insteadOf" "https://github.com/marianocappucci/$repo"
          }
          configurar libracore "$LIBRACORE_DEPLOY_KEY"
          configurar libracommerce "$LIBRACOMMERCE_DEPLOY_KEY"
          configurar libraauth "$LIBRAAUTH_DEPLOY_KEY"
          configurar libraedge "$LIBRAEDGE_DEPLOY_KEY"

      # Confirma que cada clave autentica contra SU repo y no contra otro:
      # es exactamente el modo de fallar que motiva los alias de arriba, y
      # sin este paso recien se notaria dentro del pip install, como un
      # error de git que no dice cual de las claves se uso.
      - name: Verify each deploy key resolves to its own repo
        if: steps.cambios.outputs.backend == 'true'
        run: |
          for repo in libracore libracommerce libraauth libraedge; do
            saludo=$(ssh -o StrictHostKeyChecking=yes -T "git@github-$repo" 2>&1 || true)
            echo "$repo -> $saludo"
            case "$saludo" in
              *"marianocappucci/$repo"*) ;;
              *) echo "::error::La deploy key de $repo no resuelve a marianocappucci/$repo."; exit 1 ;;
            esac
          done

      # Desde el re-empaquetado (2026-07-31) este repo es un paquete
      # instalable como el resto de la familia: mismo comando que
      # gestiolibra/medlibra/ventalibra.
      # F1 (2026-09-05): el entorno sale de `uv.lock`, no de la resolucion del dia.
      # `--locked` falla si el lock no coincide con pyproject.toml: un pin que se
      # mueve sin regenerar el lock pone rojo aca, no en produccion. El venv entra
      # al PATH para que los pasos siguientes (ruff, pytest, alembic, scripts)
      # sigan invocandose igual que antes.
      - uses: astral-sh/setup-uv@v7
        if: steps.cambios.outputs.backend == 'true'
        with:
          version: "0.12.10"
      - name: Install package + dev deps (uv.lock)
        if: steps.cambios.outputs.backend == 'true'
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Que el pin declarado sea el que efectivamente quedo instalado. Un
      # pip install que falla parcialmente ya dejo pasar suites en verde
      # contra la version anterior de un motor.
      #
      # 🔴 Hasta el 2026-09-11 este paso estaba CIEGO para libracore y
      # libracommerce, desde que existe (2026-07-31): la regex era
      # `(libra[\w-]+) @ git\+...` y no admitia EXTRAS
      # (`libracore[migrations] @ ...`), asi que solo matcheaban los motores
      # sin extras y los otros pasaban sin mirarse. Ahora las dependencias se
      # leen de `[project]` con tomllib, el nombre admite extras, y el paso
      # falla si alguna dependencia `git+` no se pudo leer o si falta alguno
      # de los motores que este producto pinea. Mismo paso que VentaLibra
      # (#231), donde se encontro.
      - name: Verify installed engine versions match the pins
        if: steps.cambios.outputs.backend == 'true'
        run: |
          python - <<'PY'
          import importlib.metadata as m, re, sys, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          patron = re.compile(r"^(libra[\w-]+)(?:\[[^\]]*\])?\s*@\s*git\+\S+\.git@v([\d.]+)$")
          pins, sin_leer = {}, []
          for dep in deps:
              if "git+" not in dep:
                  continue
              hallado = patron.match(dep.strip())
              if hallado:
                  pins[hallado.group(1)] = hallado.group(2)
              else:
                  sin_leer.append(dep)
          if sin_leer:
              print("::error::Dependencias git+ que este paso no sabe leer:", sin_leer)
              sys.exit(1)
          faltan = {"libraauth", "libracommerce", "libracore", "libraedge"} - pins.keys()
          if faltan:
              print(f"::error::No se encontro el pin de {sorted(faltan)} en pyproject.toml")
              sys.exit(1)
          fallo = False
          for paquete, esperada in sorted(pins.items()):
              real = m.version(paquete)
              print(f"{paquete}: pin={esperada} instalado={real}")
              if real != esperada:
                  print(f"::error::{paquete} instalado {real}, se esperaba {esperada}")
                  fallo = True
          sys.exit(1 if fallo else 0)
          PY

      # Lint antes que los tests: tarda segundos y su rojo se lee mucho mas
      # facil que el de una suite. El ruleset vive en pyproject.toml y esta
      # CURADO para dar cero hallazgos hoy en los 12 repos de la familia --
      # ver el comentario largo ahi. Un rojo aca es una regresion, no deuda.
      - name: Lint (ruff)
        if: steps.cambios.outputs.backend == 'true'
        run: ruff check .

      # `--cov` sin argumento toma el paquete de [tool.coverage.run] del
      # pyproject. El piso (fail_under) tambien esta ahi: es un trinquete
      # fijado 2 puntos debajo de lo medido el 2026-07-31, no una meta.
      # Una sola corrida, contra el motor real. Hasta el 2026-08-25 habia dos:
      # esta y una anterior SIN la variable, que caia a SQLite en silencio. Se
      # saco junto con el guard de `tests/conftest.py`.
      - name: Run tests
        if: steps.cambios.outputs.backend == 'true'
        env:
          RESTOLIBRA_DATABASE_URL: postgresql://restolibra:restolibra-ci@localhost:5432/restolibra
        run: pytest -v --cov --cov-report=term-missing


  # Los tests del frontend corren en su propio job: no comparten nada con
  # los de Python y asi el reporte dice cual de los dos fallo, en vez de un
  # unico job rojo. Sumado el 2026-07-31, junto con la primera suite de
  # frontend del producto.
  frontend:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `libra-ui` es un repo PRIVADO que se instala por git+https: sin
      # credenciales, `npm ci` falla al clonarlo. Se reusa la misma deploy
      # key que ya usa el Dockerfile, con el alias por repo de siempre.
      - name: Configurar acceso a libra-ui
        env:
          LIBRA_UI_DEPLOY_KEY: ${{ secrets.LIBRA_UI_DEPLOY_KEY }}
        run: |
          if [ -z "$LIBRA_UI_DEPLOY_KEY" ]; then
            echo "::error::Falta el secret LIBRA_UI_DEPLOY_KEY en este repositorio."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$LIBRA_UI_DEPLOY_KEY" > ~/.ssh/id_libra_ui
          chmod 600 ~/.ssh/id_libra_ui
          printf 'Host github-libra-ui\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_libra_ui\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."git@github-libra-ui:marianocappucci/libra-ui".insteadOf "https://github.com/marianocappucci/libra-ui"
          saludo=$(ssh -o StrictHostKeyChecking=yes -T git@github-libra-ui 2>&1 || true)
          echo "libra-ui -> $saludo"
          case "$saludo" in
            *"marianocappucci/libra-ui"*) ;;
            *) echo "::error::La deploy key no resuelve a marianocappucci/libra-ui."; exit 1 ;;
          esac
        working-directory: .

      - name: Instalar dependencias
        run: npm ci

      # El pin de libra-ui se verifica ACÁ y no sólo en local: un `npm install`
      # a secas no re-resuelve un pin git, y el build pasa en verde contra la
      # versión anterior (regla del 2026-07-30). `npm ci` respeta el lock, así
      # que lo que hay que confirmar es que el lock apunte a donde dice el
      # package.json. Mismo paso que libra-panel y libra-backoffice, que eran
      # los únicos dos consumidores que lo tenían (2026-09-10).
      #
      # Se desreferencia el tag con `^{}`: los tags de esta familia son
      # ANOTADOS, así que `rev-parse vX.Y.Z` devuelve el SHA del objeto tag y
      # nunca coincidiría con el `resolved` del lock, que guarda el commit.
      - name: Verificar que el pin de libra-ui es el que dice package.json
        working-directory: frontend
        run: |
          TAG=$(node -p "require('./package.json').dependencies['libra-ui'].split('#')[1]")
          RESUELTO=$(node -p "require('./package-lock.json').packages['node_modules/libra-ui'].resolved")
          INSTALADO=$(node -p "require('./node_modules/libra-ui/package.json').version")
          ESPERADO=$(git ls-remote https://github.com/marianocappucci/libra-ui.git "refs/tags/$TAG^{}" | cut -f1)
          echo "package.json: $TAG"
          echo "instalado:    $INSTALADO"
          echo "lock:         $RESUELTO"
          echo "commit real:  $ESPERADO"
          if [ -z "$ESPERADO" ]; then
            echo "::error::No se pudo resolver el commit del tag $TAG."; exit 1
          fi
          case "$RESUELTO" in
            *"$ESPERADO"*) echo "OK: el lock apunta al commit de $TAG" ;;
            *) echo "::error::El lock no apunta al commit de $TAG."; exit 1 ;;
          esac

      - name: Lint
        run: npm run lint

      # El build de produccion (`tsc -b && vite build`) es exactamente lo que
      # corre el Dockerfile en el deploy. Sin este paso, un error de tipos en
      # una pagina sin tests no aparecia hasta construir la imagen -- o sea,
      # durante el deploy y no en el CI.
      - name: Build de produccion
        run: npm run build

      # 🔴 No es redundante con el paso de arriba. `npm run build` devuelve 0
      # aunque `tsc -b` haya fallado con errores y no haya escrito `dist/`: sin
      # este chequeo el job queda verde habiendo producido nada, que es
      # exactamente lo que el paso de build tiene que impedir. Y `dist/` es lo
      # que el Dockerfile copia (`COPY --from=frontend-build /frontend/dist`),
      # asi que un build vacio se manifiesta recien en el deploy.
      - name: El build dejo algo de verdad
        run: test -f dist/index.html

      # `--reporter=default` mantiene la salida legible en el log; el `junit`
      # agregado deja además el XML que lee el gate del paso siguiente. Los dos
      # reporters conviven: el `--outputFile.junit` le da destino sólo al
      # segundo.
      - name: Correr los tests con cobertura
        run: |
          rm -f vitest.xml
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=vitest.xml

      # 🔑 Mismo patrón que el gate de concurrencia del job de backend, y por el
      # mismo motivo: que la suite haya CORRIDO no se deduce de que el paso
      # anterior haya salido en verde.
      #
      # 🔴 Lo que este gate agrega —y el exit code de `vitest run` NO cubre— son
      # los tests SALTEADOS. Medido el 2026-08-22 sobre vitest 3.2.7: un
      # `describe.skip` que envuelve la suite entera sale con **código 0**, así
      # que un módulo que se saltea completo deja el job igual de verde que uno
      # que corrió todo. Verificado en el CI real de LibraClub, que estrenó este
      # gate: con un módulo salteado el paso de tests queda en `success` y sólo
      # este paso lo pone en rojo.
      #
      # 🔴 `skipped` se cuenta por ocurrencias y no con `head -1`: el
      # `<testsuites>` raíz trae `tests`/`failures`/`errors` totales pero **no**
      # trae `skipped` — ese atributo vive en cada `<testsuite>`. Un `head -1`
      # leería el del primer archivo y daría por limpia una suite salteada más
      # abajo.
      #
      # `failures`/`errors` son hoy redundantes con el exit code de vitest (que
      # sí devuelve 1 con tests rojos — verificado con control positivo y
      # negativo por ocho vías el 2026-08-22). Se chequean igual porque salen
      # gratis del mismo XML y dejan de depender de que esa garantía siga
      # valiendo.
      - name: La suite de frontend corrio de verdad
        run: |
          test -f vitest.xml
          CORRIDOS=$(grep -o 'tests="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          FALLADOS=$(grep -o 'failures="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          ERRORES=$(grep -o 'errors="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          SALTEADOS=$(grep -o '<skipped/>' vitest.xml | wc -l)
          echo "frontend: $CORRIDOS corridos, $FALLADOS fallados, $ERRORES con error, $SALTEADOS salteados"
          test -n "$CORRIDOS"
          test "$CORRIDOS" -gt 0
          test "$FALLADOS" = "0"
          test "$ERRORES" = "0"
          test "$SALTEADOS" = "0"

  # F2 (2026-09-05): que el CI ponga rojo un commit con un secreto. Barre los
  # commits del PR (no toda la historia) con la configuracion de
  # `.gitleaks.toml` en la raiz, que exime `tests/` porque ahi viven las
  # contrasenas de prueba de la suite. Job independiente: corre en paralelo y
  # su rojo no se mezcla con el de la suite.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
