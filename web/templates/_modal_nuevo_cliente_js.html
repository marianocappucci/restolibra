<script>
// ── Modal nuevo cliente (compartido) ──
document.getElementById('btn-guardar-cliente').addEventListener('click', async function () {
  const name   = document.getElementById('nc-name').value.trim();
  const errDiv = document.getElementById('modal-nc-error');
  errDiv.classList.add('d-none');
  if (!name) {
    errDiv.textContent = 'El nombre es obligatorio.';
    errDiv.classList.remove('d-none');
    return;
  }
  const body = new FormData();
  body.append('name',          name);
  body.append('cuit_dni',      document.getElementById('nc-cuit').value.trim());
  body.append('iva_condition', document.getElementById('nc-iva').value);
  body.append('email',         document.getElementById('nc-email').value.trim());
  body.append('phone',         document.getElementById('nc-phone').value.trim());

  const res  = await fetch('/clientes/nuevo-rapido', { method: 'POST', body });
  const data = await res.json();
  if (data.error) {
    errDiv.textContent = data.error;
    errDiv.classList.remove('d-none');
    return;
  }

  const sel = document.getElementById('client-select');
  const opt = document.createElement('option');
  opt.value           = data.id;
  opt.text            = data.name;
  opt.dataset.cuit    = data.cuit_dni      || '';
  opt.dataset.iva     = data.iva_condition || '';
  opt.dataset.address = data.address       || '';
  opt.dataset.email   = data.email         || '';
  opt.dataset.phone   = data.phone         || '';
  sel.appendChild(opt);
  sel.value = data.id;
  applyClientSelection(opt);

  bootstrap.Modal.getInstance(document.getElementById('modal-nuevo-cliente')).hide();
  ['nc-name','nc-cuit','nc-email','nc-phone'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('nc-iva').value = '';
});
</script>
