{% extends "base.html" %}
{% block title %}Abrir mesa — Restolibra{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-shop me-2 text-primary"></i>Mesa {{ mesa.nombre }}</h1>
  <a href="/salon?salon_id={{ mesa.salon_id }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Volver al salón
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <p class="text-muted">{{ mesa.salon_nombre }} · capacidad {{ mesa.capacidad }} cubiertos</p>
        <form method="post" action="/salon/mesa/{{ mesa.id }}/abrir">
          <label class="form-label">Comensales</label>
          <input type="number" name="comensales" class="form-control mb-3" value="{{ mesa.capacidad }}" min="1">
          <button class="btn btn-primary w-100"><i class="bi bi-play-circle me-1"></i>Abrir pedido</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
