<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDS {{ estacion|capitalize }} — Restolibra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary:               #ea580c;
      --bs-primary-rgb:           234, 88, 12;
      --bs-primary-text-emphasis: #c2410c;
      --bs-primary-bg-subtle:     #fff7ed;
      --bs-primary-border-subtle: #fed7aa;
    }
    body { background: #fbf9f6; padding: 1.25rem; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.07); border-radius: 12px; }
    .card-header { background: transparent; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
    #btn-fullscreen { position: fixed; top: 10px; right: 10px; z-index: 1000; opacity: .55; }
    #btn-fullscreen:hover { opacity: 1; }
  </style>
</head>
<body>
  <button type="button" id="btn-fullscreen" class="btn btn-sm btn-outline-secondary"
          onclick="toggleFullscreen()" title="Pantalla completa">
    <i class="ti ti-arrows-maximize"></i>
  </button>

  <h1 class="mb-3">
    <i class="ti {% if estacion == 'cocina' %}ti-flame text-danger{% else %}ti-glass-cocktail text-info{% endif %} me-2"></i>
    KDS {{ estacion|capitalize }}
  </h1>

  <div class="row g-3">
    <div class="col-md-4">
      <h6 class="text-danger"><i class="ti ti-hourglass"></i> Pendientes</h6>
      <div id="col-pendiente" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="col-md-4">
      <h6 class="text-warning"><i class="ti ti-flame"></i> En preparación</h6>
      <div id="col-preparacion" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="col-md-4">
      <h6 class="text-success"><i class="ti ti-circle-check"></i> Listas</h6>
      <div id="col-listo" class="d-flex flex-column gap-2"></div>
    </div>
  </div>
  <p class="text-muted small mt-3" id="kds-status">Actualizando…</p>

  <script>
function toggleFullscreen(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener("fullscreenchange", () => {
  const icon = document.querySelector("#btn-fullscreen i");
  icon.className = document.fullscreenElement ? "ti ti-arrows-minimize" : "ti ti-arrows-maximize";
});
  </script>
  {% include "kds/_pantalla_script.html" %}
</body>
</html>
