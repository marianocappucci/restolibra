<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDS {{ estacion|capitalize }} — Restolibra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; padding: 1.25rem; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.07); border-radius: 12px; }
    .card-header { background: transparent; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
  </style>
</head>
<body>
  <h1 class="mb-3">
    <i class="bi {% if estacion == 'cocina' %}bi-fire text-danger{% else %}bi-cup-straw text-info{% endif %} me-2"></i>
    KDS {{ estacion|capitalize }}
  </h1>

  <div class="row g-3">
    <div class="col-md-4">
      <h6 class="text-danger"><i class="bi bi-hourglass-split"></i> Pendientes</h6>
      <div id="col-pendiente" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="col-md-4">
      <h6 class="text-warning"><i class="bi bi-fire"></i> En preparación</h6>
      <div id="col-preparacion" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="col-md-4">
      <h6 class="text-success"><i class="bi bi-check2-circle"></i> Listas</h6>
      <div id="col-listo" class="d-flex flex-column gap-2"></div>
    </div>
  </div>
  <p class="text-muted small mt-3" id="kds-status">Actualizando…</p>

  {% include "kds/_pantalla_script.html" %}
</body>
</html>
