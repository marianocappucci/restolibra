<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDS {{ estacion|capitalize }} — Restolibra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/vendor/material-symbols/material-symbols-outlined.css?v=2" rel="stylesheet">
  <style>
    :root {
      --bs-primary:               #ea580c;
      --bs-primary-rgb:           234, 88, 12;
      --bs-primary-text-emphasis: #c2410c;
      --bs-primary-bg-subtle:     #fff7ed;
      --bs-primary-border-subtle: #fed7aa;
    }
    body { background: #fbf9f6; padding: 1.25rem; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.07); border-radius: 12px; }
    .card-header { background: transparent; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
    #btn-fullscreen { position: fixed; top: 10px; right: 10px; z-index: 1000; opacity: .55; }
    #btn-fullscreen:hover { opacity: 1; }
    .page-header { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .header-clock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; line-height: 1.15; pointer-events: none; }
    .header-clock-time { font-size: 1.62rem; font-weight: 700; }
    .header-clock-fecha { font-size: .86rem; color: #8a7a6c; text-transform: capitalize; }
  </style>
</head>
<body>
  <button type="button" id="btn-fullscreen" class="btn btn-sm btn-outline-secondary"
          onclick="toggleFullscreen()" title="Pantalla completa">
    <span class="material-symbols-outlined">fullscreen</span>
  </button>

  <div class="page-header">
    <h1 class="mb-0">
      <span class="material-symbols-outlined {% if estacion == 'cocina' %}text-danger{% else %}text-info{% endif %} me-2">{% if estacion == 'cocina' %}local_fire_department{% else %}local_bar{% endif %}</span>
      KDS {{ estacion|capitalize }}
    </h1>
    {% include "_reloj.html" %}
    <span></span>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <h6 class="text-danger"><span class="material-symbols-outlined">hourglass_empty</span> Pendientes</h6>
      <div id="col-pendiente" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="col-md-4">
      <h6 class="text-warning"><span class="material-symbols-outlined">local_fire_department</span> En preparación</h6>
      <div id="col-preparacion" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="col-md-4">
      <h6 class="text-success"><span class="material-symbols-outlined">check_circle</span> Listas</h6>
      <div id="col-listo" class="d-flex flex-column gap-2"></div>
    </div>
  </div>
  <p class="text-muted small mt-3" id="kds-status">Actualizando…</p>

  <script>
function toggleFullscreen(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener("fullscreenchange", () => {
  const icon = document.querySelector("#btn-fullscreen span");
  icon.textContent = document.fullscreenElement ? "fullscreen_exit" : "fullscreen";
});
  </script>
  {% include "kds/_pantalla_script.html" %}
</body>
</html>
