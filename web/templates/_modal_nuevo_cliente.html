<div class="modal fade" id="modal-nuevo-cliente" tabindex="-1" aria-labelledby="modal-nc-label" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-nc-label"><i class="ti ti-user-plus me-2"></i>Nuevo cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modal-nc-error" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre / Razón social <span class="text-danger">*</span></label>
          <input type="text" id="nc-name" class="form-control" placeholder="Ej: Juan García">
        </div>
        <div class="mb-3">
          <label class="form-label">CUIT / DNI</label>
          <input type="text" id="nc-cuit" class="form-control" placeholder="20-12345678-9">
        </div>
        <div class="mb-3">
          <label class="form-label">Condición IVA</label>
          <select id="nc-iva" class="form-select">
            <option value="">— Sin especificar —</option>
            <option>Consumidor Final</option>
            <option>Responsable Inscripto</option>
            <option>Monotributista</option>
            <option>IVA Exento</option>
            <option>No Alcanzado</option>
            <option>IVA No Responsable</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="nc-email" class="form-control" placeholder="cliente@ejemplo.com">
        </div>
        <div class="mb-0">
          <label class="form-label">Teléfono</label>
          <input type="text" id="nc-phone" class="form-control" placeholder="11 1234-5678">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btn-guardar-cliente">
          <i class="ti ti-check me-1"></i>Guardar y seleccionar
        </button>
      </div>
    </div>
  </div>
</div>
