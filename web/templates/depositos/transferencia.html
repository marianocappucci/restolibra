{% extends "base.html" %}
{% block title %}Transferir stock entre depósitos — Contalibra{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-arrow-left-right me-2 text-primary"></i>Transferir stock</h1>
  <a href="/depositos" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-body">
        <form method="post" action="/depositos/transferir" id="form-transferencia">
          <div class="mb-3">
            <label class="form-label fw-semibold">Producto <span class="text-danger">*</span></label>
            <select name="producto_id" class="form-select" id="sel-producto" required onchange="mostrarStock()">
              <option value="">— Seleccioná un producto —</option>
              {% for p in productos %}
              <option value="{{ p.id }}">{{ p.nombre }}{% if p.codigo %} ({{ p.codigo }}){% endif %}</option>
              {% endfor %}
            </select>
          </div>

          <div id="panel-stock" class="alert alert-light border mb-3 d-none">
            <div class="small fw-semibold mb-1"><i class="bi bi-info-circle me-1"></i>Stock disponible por depósito:</div>
            <div id="stock-detalle" class="small"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Depósito origen <span class="text-danger">*</span></label>
              <select name="origen_id" class="form-select" required>
                <option value="">— Origen —</option>
                {% for d in depositos %}
                {% if d.activo %}
                <option value="{{ d.id }}">{{ d.nombre }}{% if d.es_default %} ★{% endif %}</option>
                {% endif %}
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Depósito destino <span class="text-danger">*</span></label>
              <select name="destino_id" class="form-select" required>
                <option value="">— Destino —</option>
                {% for d in depositos %}
                {% if d.activo %}
                <option value="{{ d.id }}">{{ d.nombre }}{% if d.es_default %} ★{% endif %}</option>
                {% endif %}
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Cantidad <span class="text-danger">*</span></label>
              <input type="number" name="cantidad" class="form-control" min="0.001" step="any" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Fecha</label>
              <input type="date" name="fecha" class="form-control" value="{{ hoy }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Observaciones</label>
              <input type="text" name="observaciones" class="form-control" placeholder="Opcional">
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-arrow-left-right me-2"></i>Confirmar transferencia
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
async function mostrarStock() {
  const pid = document.getElementById('sel-producto').value;
  const panel = document.getElementById('panel-stock');
  const detalle = document.getElementById('stock-detalle');
  if (!pid) { panel.classList.add('d-none'); return; }

  const res  = await fetch(`/depositos/stock-producto/${pid}`);
  const data = await res.json();
  detalle.innerHTML = data.map(d =>
    `<span class="me-3"><strong>${d.nombre}${d.es_default ? ' ★' : ''}:</strong> ${d.stock_actual}</span>`
  ).join('');
  panel.classList.remove('d-none');
}
</script>
{% endblock %}
