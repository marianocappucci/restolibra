<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restolibra — Ingresar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary:               #ea580c;
      --bs-primary-rgb:           234, 88, 12;
      --bs-primary-text-emphasis: #c2410c;
      --bs-primary-bg-subtle:     #fff7ed;
      --bs-primary-border-subtle: #fed7aa;
    }
    .btn-primary {
      --bs-btn-color: #fff;
      --bs-btn-bg: #ea580c;
      --bs-btn-border-color: #ea580c;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #c2410c;
      --bs-btn-hover-border-color: #c2410c;
      --bs-btn-focus-shadow-rgb: 234, 88, 12;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #c2410c;
      --bs-btn-active-border-color: #c2410c;
    }
    .form-control:focus {
      border-color: #f0995f;
      box-shadow: 0 0 0 .25rem rgba(234, 88, 12, .25);
    }
    body { background: #1c1410; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; border-radius: 16px; border: none; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
    .login-brand { font-size: 1.6rem; font-weight: 700; color: #1c1410; letter-spacing: .03em; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <i class="bi bi-journal-bookmark-fill fs-1 text-primary"></i>
      <div class="login-brand mt-1">Restolibra</div>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuario</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Ingresar</button>
    </form>
  </div>
</body>
</html>
